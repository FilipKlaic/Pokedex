services:
  db:
    image: postgres:17
    container_name: pokedex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: pokedex
      POSTGRES_DB: pokedex
    ports:
      - "5432:5432"
    volumes:
      - pokedex-data:/var/lib/postgresql/data

volumes:
  pokedex-data:
